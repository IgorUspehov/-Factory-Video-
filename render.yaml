services:
  - type: web
    name: factory-video
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
  - type: web
    name: factory-video-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PEXELS_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://factory-video.onrender.com
      - key: DATA_DIR
        value: ./data
      - key: PUBLIC_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: AVATAR_OWNER_EMAILS
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: RUNPOD_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
